# ============================================================
# ERP 完整部署（含資料庫、後端、前端、快取、監控）
# 使用方式:
#   1. 後端+監控:  docker-compose -f deployment/docker-compose.yml up -d backend prometheus grafana
#   2. 全部啟動:   docker-compose -f deployment/docker-compose.yml up -d
# ============================================================

services:
  # ---------- PostgreSQL 資料庫 ----------
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ErpGeneral}
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請設定 POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-ErpGeneral}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------- Redis 快取與佇列 ----------
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  # ---------- ERP 後端 ----------
  backend:
    image: ghcr.io/stan5827/erp-backend:${IMAGE_TAG:-latest}
    container_name: erp-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-40}
      DB_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ErpGeneral};Username=${POSTGRES_USER:-erp};Password=${POSTGRES_PASSWORD:?請設定 POSTGRES_PASSWORD}"
      REDIS_CONNECTION_STRING: redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?請設定 JWT_SECRET_KEY (至少32字元)}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${OPENAI_API_KEY:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      ADMIN_RESET_SECRET: ${ADMIN_RESET_SECRET:-}
      AttendanceGeofence__Latitude: ${AttendanceGeofence__Latitude:-}
      AttendanceGeofence__Longitude: ${AttendanceGeofence__Longitude:-}
      AttendanceGeofence__RadiusMeters: ${AttendanceGeofence__RadiusMeters:-}
      AttendanceGeofence__TimeZoneId: ${AttendanceGeofence__TimeZoneId:-Asia/Taipei}
      SupplierIdentity__Authority: "${SUPPLIER_IDENTITY_AUTHORITY:-}"
      SupplierIdentity__Audience: "${SUPPLIER_IDENTITY_AUDIENCE:-}"
      SupplierIdentity__AdminBaseUrl: "${SUPPLIER_IDENTITY_ADMIN_BASE_URL:-}"
      SupplierIdentity__AdminClientId: "${SUPPLIER_IDENTITY_ADMIN_CLIENT_ID:-}"
      SupplierIdentity__AdminClientSecret: "${SUPPLIER_IDENTITY_ADMIN_CLIENT_SECRET:-}"
      SupplierIdentity__InvitationLifespanSeconds: "${SUPPLIER_IDENTITY_INVITATION_LIFESPAN_SECONDS:-86400}"
      SupplierIdentity__RequireTotp: "${SUPPLIER_IDENTITY_REQUIRE_TOTP:-true}"
      SupplierIdentity__AllowHttpMetadata: "${SUPPLIER_IDENTITY_ALLOW_HTTP_METADATA:-false}"
    ports:
      - "5100:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---------- ERP 前端 ----------
  frontend:
    image: ghcr.io/stan5827/erp-frontend:${IMAGE_TAG:-latest}
    container_name: erp-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ---------- Prometheus 監控 ----------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: erp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      - backend
    restart: unless-stopped

  # ---------- Grafana 儀表板 ----------
  grafana:
    image: grafana/grafana-enterprise:10.4.0
    container_name: erp-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?請設定 GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

  # ---------- Alertmanager 告警管理 ----------
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: erp-alertmanager
    ports:
      - "9093:9093"
    volumes:
      # Local default exposes alerts through the UI/API without sending notifications.
      # Use a validated notification config only after configuring real destinations.
      - ${ALERTMANAGER_CONFIG_FILE:-./alertmanager.local.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped

  # ---------- k6 負載測試 (需手動啟動) ----------
  k6:
    image: grafana/k6:latest
    container_name: erp-k6
    profiles:
      - load-test
    volumes:
      - ../tests/performance/scripts:/scripts:ro
    environment:
      - BASE_URL=http://backend:8080
      - VUS=50
      - DURATION=5m
    depends_on:
      - backend
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
