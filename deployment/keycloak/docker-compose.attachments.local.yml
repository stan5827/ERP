services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: erp-supplier-portal-test-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - supplier_portal_ap_test_minio_data:/data
    restart: unless-stopped

  create-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.local}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing local/supplier-portal-ap-attachments
    restart: "no"

  clamav:
    image: clamav/clamav:stable
    container_name: erp-supplier-portal-test-clamav
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - supplier_portal_ap_test_clamav_data:/var/lib/clamav
    restart: unless-stopped

volumes:
  supplier_portal_ap_test_minio_data:
  supplier_portal_ap_test_clamav_data:
