name: ERP CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore .NET packages
        run: dotnet restore ERP.sln
      - name: Run backend tests
        run: dotnet test ERP.sln --no-restore
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/*.trx'

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend dependencies
        run: |
          cd erp-frontend
          npm ci
      - name: Run frontend lint
        run: |
          cd erp-frontend
          npm run lint
      - name: Build frontend
        run: |
          cd erp-frontend
          npm run build
      - name: Upload frontend build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: erp-frontend/dist

  e2e:
    name: Frontend E2E tests
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend dependencies
        run: |
          cd erp-frontend
          npm ci
      - name: Install Playwright browser
        run: |
          cd erp-frontend
          npx playwright install chromium
      - name: Run Playwright E2E tests
        run: |
          cd erp-frontend
          npm run e2e
