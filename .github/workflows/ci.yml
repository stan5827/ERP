name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --------------------------------------------------------
  # 1. Build & Test
  # --------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore unit test dependencies
        run: dotnet restore ErpBackend.Tests/ErpBackend.Tests.csproj

      - name: Restore integration test dependencies
        run: dotnet restore ErpBackend.IntegrationTests/ErpBackend.IntegrationTests.csproj

      - name: Build unit tests and backend
        run: dotnet build ErpBackend.Tests/ErpBackend.Tests.csproj --configuration Release --no-restore

      - name: Build integration tests and backend
        run: dotnet build ErpBackend.IntegrationTests/ErpBackend.IntegrationTests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ErpBackend.Tests/ErpBackend.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=unit-tests.trx" --verbosity normal

      - name: Run integration tests (Architecture + E2E)
        run: dotnet test ErpBackend.IntegrationTests/ErpBackend.IntegrationTests.csproj --configuration Release --no-build --logger "trx;LogFileName=integration-tests.trx" --verbosity normal

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: erp-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: erp-frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: erp-frontend
        run: npx playwright install --with-deps chromium

      - name: Lint frontend
        working-directory: erp-frontend
        run: npm run lint

      - name: Build frontend
        working-directory: erp-frontend
        run: npm run build

      - name: Run frontend unit tests
        working-directory: erp-frontend
        run: npm test

      - name: Run frontend Playwright E2E tests
        if: always()
        working-directory: erp-frontend
        run: npm run test:e2e

      - name: Install employee app dependencies
        working-directory: erp-employee-app
        run: npm ci

      - name: Build employee app
        working-directory: erp-employee-app
        run: npm run build

      - name: Test employee app
        working-directory: erp-employee-app
        run: npm test

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ErpBackend.Tests/**/coverage.cobertura.xml
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ErpBackend.Tests/TestResults/
            ErpBackend.IntegrationTests/TestResults/

  # --------------------------------------------------------
  # 2. Build & Push Docker Image
  # --------------------------------------------------------
  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Extract frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # --------------------------------------------------------
  # 3. Security Scan (Trivy)
  # --------------------------------------------------------
  security-scan:
    needs: [build-and-test, build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set deployed image references
        id: image-refs
        env:
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "backend=${REGISTRY}/${repository}-backend:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${repository}-frontend:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan backend deployment image
        uses: aquasecurity/trivy-action@v0.18.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.image-refs.outputs.backend }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Scan frontend deployment image
        uses: aquasecurity/trivy-action@v0.18.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.image-refs.outputs.frontend }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # --------------------------------------------------------
  # 4. Deploy UAT, then wait for protected production approval
  # --------------------------------------------------------
  deploy-uat:
    needs: [build-and-push, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: uat
    permissions:
      contents: read
    concurrency:
      group: erp-uat-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Deploy UAT image and wait for health checks
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *"/../"* && "$DEPLOY_PATH" != */.. ]]
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] && (( port <= 65535 ))
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/erp_deploy_key"
          chmod 600 "$HOME/.ssh/erp_deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh_options=(-i "$HOME/.ssh/erp_deploy_key" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes)

          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/deployment'"
          scp -i "$HOME/.ssh/erp_deploy_key" -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deployment/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deployment/docker-compose.yml"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH' 'sha-${GITHUB_SHA}'" < deployment/scripts/deploy-production.sh

  deploy-production:
    needs: deploy-uat
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    concurrency:
      group: erp-production-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Deploy production image and wait for health checks
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *"/../"* && "$DEPLOY_PATH" != */.. ]]
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] && (( port <= 65535 ))
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/erp_deploy_key"
          chmod 600 "$HOME/.ssh/erp_deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh_options=(-i "$HOME/.ssh/erp_deploy_key" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes)

          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/deployment'"
          scp -i "$HOME/.ssh/erp_deploy_key" -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deployment/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deployment/docker-compose.yml"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH' 'sha-${GITHUB_SHA}'" < deployment/scripts/deploy-production.sh
