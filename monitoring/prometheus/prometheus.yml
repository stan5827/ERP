global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'erp-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5100']
        labels:
          environment: 'development'
          service: 'erp-api'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
